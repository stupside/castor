# A live AES-128 channel with a sliding window names no IV, leaving each segment's sequence number as its IV, and plays whole when joined deep into its window.
# Keep eight of the ten initially published segments: the join is still at a nonzero sequence,
# without expiring more source time than the suite's existing live-join duration allowance.
stream:
  packaging: hls-ts-aes128
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 20
origin:
  implicit-iv: {}
  event: {offset: 0}
  live: {start: 10, every: 1s, end: endlist, window: 8}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
