name: castor

x-castor: &castor
  image: ghcr.io/stupside/castor:latest
  restart: unless-stopped
  volumes:
    - ./config.yaml:/config.yaml:ro
    - castor-cache:/root/.cache

services:
  scraping-server:
    <<: *castor
    command: ["scraping-server"]
    ports:
      - "8412:8412"
    environment:
      CASTOR_SCRAPING__TOKEN: ${CASTOR_SCRAPING__TOKEN:?set it in .env}

  media-server:
    <<: *castor
    command: ["media-server"]
    ports:
      - "8410:8410"
    # Intel VA-API; drop on hosts without /dev/dri.
    devices:
      - /dev/dri:/dev/dri
    environment:
      CASTOR_SERVER__TOKEN: ${CASTOR_SERVER__TOKEN:?set it in .env}

  api-server:
    <<: *castor
    command: ["api-server"]
    ports:
      - "8411:8411"
    depends_on:
      - media-server
      - scraping-server
    environment:
      CASTOR_API__TOKEN: ${CASTOR_API__TOKEN:?set it in .env}
      CASTOR_SERVER__URL: http://media-server:8410
      CASTOR_SERVER__TOKEN: ${CASTOR_SERVER__TOKEN:?set it in .env}
      CASTOR_SCRAPING__URL: http://scraping-server:8412
      CASTOR_SCRAPING__TOKEN: ${CASTOR_SCRAPING__TOKEN:?set it in .env}

volumes:
  castor-cache:
