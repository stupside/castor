<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Castor, a Go gopher in a beaver costume, holding a remote">
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#wobble)" stroke="#1f1a17" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Costume tail -->
    <path d="M70 68 C 80 62, 95 66, 96 77 C 97 87, 86 91, 77 87 C 70 84, 66 76, 70 68 Z" fill="#7a5638"/>
    <path d="M74 70 L 92 84 M 84 65 L 95 75 M 90 68 L 76 86" stroke="#9c7552" stroke-width="1"/>

    <!-- Feet -->
    <ellipse cx="39" cy="92" rx="7" ry="3.8" fill="#f3d3a6"/>
    <ellipse cx="61" cy="92" rx="7" ry="3.8" fill="#f3d3a6"/>

    <!-- Hood ears -->
    <circle cx="32" cy="17" r="6.5" fill="#a5744d"/>
    <circle cx="68" cy="17" r="6.5" fill="#a5744d"/>
    <circle cx="32" cy="17" r="2.8" fill="#7a5638" stroke="none"/>
    <circle cx="68" cy="17" r="2.8" fill="#7a5638" stroke="none"/>

    <!-- Costume -->
    <path d="M50 12 C 30 12, 25 28, 25 46 C 25 64, 22 80, 30 87 C 37 93, 63 93, 70 87 C 78 80, 75 64, 75 46 C 75 28, 70 12, 50 12 Z" fill="#a5744d"/>
    <ellipse cx="50" cy="76" rx="14" ry="11" fill="#ecd6b6"/>

    <!-- Gopher face through the hood -->
    <ellipse cx="50" cy="41" rx="19" ry="17" fill="#7fd3e6"/>

    <!-- Right paw hanging -->
    <ellipse cx="76" cy="60" rx="3.5" ry="6" transform="rotate(-20 76 60)" fill="#7fd3e6"/>

    <!-- Remote and the paw holding it -->
    <rect x="12" y="40" width="7" height="15" rx="2" transform="rotate(-20 15.5 47.5)" fill="#3a3a3a"/>
    <circle cx="14.5" cy="43" r="1.4" fill="#e5484d" stroke="none"/>
    <ellipse cx="22" cy="54" rx="4.5" ry="5" fill="#7fd3e6"/>

    <!-- Eyes peeking at the remote -->
    <circle cx="41" cy="36" r="7.5" fill="#ffffff"/>
    <circle cx="60" cy="36" r="7.5" fill="#ffffff"/>
    <circle cx="37.5" cy="35.5" r="2.7" fill="#1f1a17"/>
    <circle cx="56.5" cy="35.5" r="2.7" fill="#1f1a17"/>

    <!-- Muzzle, nose, teeth -->
    <ellipse cx="50" cy="47.5" rx="6.5" ry="4.5" fill="#f3d3a6"/>
    <ellipse cx="50" cy="45" rx="2.6" ry="1.8" fill="#1f1a17"/>
    <path d="M47.5 51.5 h 2.5 v 3.5 h -2.5 Z M 50 51.5 h 2.5 v 3.5 h -2.5 Z" fill="#ffffff" stroke-width="0.9"/>
  </g>
</svg>
