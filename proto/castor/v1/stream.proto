syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";

// Stream is one link to the media, with what fetching it needs.
message Stream {
  string url = 1 [
    (buf.validate.field).string.max_len = 8192,
    (buf.validate.field).cel = {
      id: "url.http"
      message: "must be an http or https URL"
      expression: "this.isUri() && (this.startsWith('http://') || this.startsWith('https://'))"
    }
  ];
  // headers are replayed on every fetch, as captured where the link was found.
  map<string, string> headers = 2 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME}
    }
    values: {
      string: {
        well_known_regex: KNOWN_REGEX_HTTP_HEADER_VALUE
        strict: false
      }
    }
  }];
  // content_type is empty for a link given as is, which castor then identifies.
  string content_type = 3;
}

// StreamCandidate pairs playback data with evidence from discovery.
message StreamCandidate {
  Stream stream = 1 [(buf.validate.field).required = true];
  string source_page = 2 [
    (buf.validate.field).string.max_len = 8192,
    (buf.validate.field).cel = {
      id: "source_page.http"
      message: "must be empty or an http or https URL"
      expression: "this == '' || (this.isUri() && (this.startsWith('http://') || this.startsWith('https://')))"
    }
  ];
  Ladder ladder = 3 [(buf.validate.field).enum.defined_only = true];
}

enum Ladder {
  LADDER_UNSPECIFIED = 0;
  LADDER_MULTIVARIANT = 1;
  LADDER_SOLE = 2;
}

enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  // DELIVERY_AUTO lets the evidence decide between pass-through and serving.
  DELIVERY_AUTO = 1;
  // DELIVERY_SERVE refuses pass-through: the media server reads the source and serves the device.
  DELIVERY_SERVE = 2;
}

message RankedStream {
  string url = 1;
  // bitrate is in bits per second, absent when neither measured nor declared.
  optional uint64 bitrate = 2 [(buf.validate.field).uint64.gt = 0];
  // last_resort marks a stream admitted without a measurement to back it.
  bool last_resort = 3;
}
