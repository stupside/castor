syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";

message Stream {
  string url = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://"
    max_bytes: 8192
  }];
  // headers are sent on every fetch, as captured where the link was found.
  map<string, string> headers = 2 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME}
    }
    values: {
      string: {
        well_known_regex: KNOWN_REGEX_HTTP_HEADER_VALUE
        strict: false
      }
    }
  }];
  // content_type is empty when castor should identify the link itself.
  string content_type = 3;
}

message StreamCandidate {
  Stream stream = 1 [(buf.validate.field).required = true];
  string source_page = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      pattern: "^https?://"
      max_bytes: 8192
    }
  ];
  Ladder ladder = 3 [(buf.validate.field).enum.defined_only = true];
}

enum Ladder {
  LADDER_UNSPECIFIED = 0;
  LADDER_MULTIVARIANT = 1;
  LADDER_SOLE = 2;
}

enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  // DELIVERY_AUTO lets the evidence decide between pass-through and serving.
  DELIVERY_AUTO = 1;
  // DELIVERY_SERVE never passes the source through: the media server serves the device.
  DELIVERY_SERVE = 2;
}

message RankedStream {
  string url = 1;
  // bitrate is in bits per second, absent when neither measured nor declared.
  optional uint64 bitrate = 2 [(buf.validate.field).uint64.gt = 0];
  // last_resort is a stream admitted without a measurement.
  bool last_resort = 3;
}
