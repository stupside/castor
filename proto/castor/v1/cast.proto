syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";
import "castor/v1/device.proto";
import "castor/v1/log.proto";
import "castor/v1/revision.proto";
import "castor/v1/stream.proto";
import "google/protobuf/empty.proto";

// CastService plays video on devices.
service CastService {
  // Cast starts playing a source on a device and returns at once; Watch follows it.
  rpc Cast(CastRequest) returns (CastResponse);
  // Resolve is what Cast would play from a source, best first, without casting.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Watch sends a cast's status now and on every change (changes close together may arrive as one), its log lines when asked, and Ended last; a stream cut before Ended is an error.
  // A cast stays watchable for 5 minutes after its end.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // Stop ends a cast and returns at once.
  rpc Stop(StopRequest) returns (StopResponse);
  // ListCasts is the casts playing now, oldest first.
  rpc ListCasts(ListCastsRequest) returns (ListCastsResponse);
}

message CastRequest {
  Target target = 1 [(buf.validate.field).required = true];
  Source source = 2 [(buf.validate.field).required = true];
  Preferences preferences = 3;
}

message CastResponse {
  // cast_id is opaque.
  string cast_id = 1;
}

message ResolveRequest {
  Source source = 1 [(buf.validate.field).required = true];
  Preferences preferences = 2;
}

message ResolveResponse {
  // ranked is the order a cast tries the streams in, best first.
  repeated RankedStream ranked = 1;
}

// Source is a direct stream, pages to resolve, or already-resolved candidates to rank.
message Source {
  oneof source {
    option (buf.validate.oneof).required = true;
    Stream stream = 1;
    Pages pages = 2;
    ResolvedStreams streams = 3;
  }

  message Pages {
    repeated string urls = 1 [
      (buf.validate.field).repeated.min_items = 1,
      (buf.validate.field).repeated.max_items = 16,
      (buf.validate.field).repeated.items.string.max_len = 8192,
      (buf.validate.field).repeated.items.cel = {
        id: "url.http"
        message: "must be an http or https URL"
        expression: "this.isUri() && (this.startsWith('http://') || this.startsWith('https://'))"
      }
    ];
  }

  message ResolvedStreams {
    repeated StreamCandidate streams = 1 [
      (buf.validate.field).repeated.min_items = 1,
      (buf.validate.field).repeated.max_items = 1600
    ];
  }
}

// Preferences are what one cast asks; each unset field takes the server's configuration.
message Preferences {
  optional Delivery delivery = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // max_height is the tallest picture the cast may show.
  optional uint32 max_height = 2 [(buf.validate.field).uint32.gte = 2];
  // Absent subtitles inherit the server's default; an explicit mode replaces it.
  SubtitleSelection subtitles = 3;
}

message SubtitleSelection {
  oneof mode {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty disabled = 1;
    google.protobuf.Empty auto_detect = 2;
    string language = 3 [(buf.validate.field).string.pattern = "^[a-z]{2,3}$"];
  }
}

message WatchRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
  // logs is the least severe line sent; unset sends none.
  optional LogLevel logs = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message WatchResponse {
  oneof update {
    CastStatus status = 1;
    LogLine line = 2;
    // ended is always the last message.
    Ended ended = 3;
  }
}

// CastStatus is where a cast stands, for people to read.
message CastStatus {
  oneof state {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty connecting = 1;
    google.protobuf.Empty extracting = 2;
    MeasuringStatus measuring = 3;
    CastingStatus casting = 4;
  }
}

message MeasuringStatus {
  uint32 streams = 1;
  // Absent until ranking finishes; zero means no candidate was retained.
  optional uint32 castable = 2;
}

message CastingStatus {
  uint32 streams = 1;
  uint32 castable = 2;
  uint32 attempt = 3 [(buf.validate.field).uint32.gte = 1];
  Revision revision = 4;
}

message Ended {
  oneof result {
    option (buf.validate.oneof).required = true;
    // Completion means playback ended or the device accepted a direct hand-off.
    google.protobuf.Empty completed = 1;
    google.protobuf.Empty stopped = 2;
    Failure failed = 3;
  }
}

message Failure {
  FailureCode code = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string message = 2 [(buf.validate.field).string.min_len = 1];
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_PLAYBACK_FAILED = 1;
  FAILURE_CODE_DEVICE_UNREACHABLE = 2;
  FAILURE_CODE_EXTRACTION_FAILED = 3;
  FAILURE_CODE_SERVER_SHUTDOWN = 4;
  FAILURE_CODE_INTERNAL = 5;
}

message StopRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
}

message StopResponse {}

message ListCastsRequest {}

message ListCastsResponse {
  repeated Cast casts = 1;
}

message Cast {
  // id is opaque.
  string id = 1;
  // device is what the cast plays on; a pinned one has an empty id.
  Device device = 2;
  Source source = 3;
  CastStatus status = 4;
}
