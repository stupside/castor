syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";
import "castor/v1/device.proto";
import "castor/v1/revision.proto";
import "castor/v1/stream.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

service CastService {
  // Cast starts playing a source on a device and returns at once; Watch follows it.
  rpc Cast(CastRequest) returns (CastResponse);
  // Resolve is what Cast would play from a source, best first, without casting.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Watch sends the status now and on every change, then Ended; a stream cut before Ended is an error.
  // A cast stays watchable for 5 minutes after it ends.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  // ListCasts is the casts playing now, oldest first.
  rpc ListCasts(ListCastsRequest) returns (ListCastsResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  // Resume ends a Pause; a device castor holds while its stream catches up plays once it has.
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Seek(SeekRequest) returns (SeekResponse);
}

message CastRequest {
  Target target = 1 [(buf.validate.field).required = true];
  Source source = 2 [(buf.validate.field).required = true];
  Preferences preferences = 3;
  MediaInfo media_info = 4;
  // start is where in the media to begin, the beginning when unset.
  google.protobuf.Duration start = 5 [(buf.validate.field).duration.gt = {}];
}

// MediaInfo is what the device's playback screen shows.
message MediaInfo {
  string title = 1 [(buf.validate.field).string.max_len = 256];
  string synopsis = 2 [(buf.validate.field).string.max_len = 4096];
  string image_url = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      pattern: "^https?://"
      max_bytes: 8192
    }
  ];
  string release_date = 4 [(buf.validate.field).string.max_len = 10];
}

message CastResponse {
  string cast_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];
}

message ResolveRequest {
  Source source = 1 [(buf.validate.field).required = true];
  Preferences preferences = 2;
}

message ResolveResponse {
  repeated RankedStream ranked = 1;
}

message Source {
  oneof source {
    option (buf.validate.oneof).required = true;
    Stream stream = 1;
    Pages pages = 2;
    ResolvedStreams streams = 3;
  }

  message Pages {
    repeated string urls = 1 [(buf.validate.field).repeated = {
      min_items: 1
      max_items: 16
      items: {
        string: {
          uri: true
          pattern: "^https?://"
          max_bytes: 8192
        }
      }
    }];
  }

  message ResolvedStreams {
    repeated StreamCandidate streams = 1 [(buf.validate.field).repeated = {
      min_items: 1
      max_items: 1600
    }];
  }
}

// Preferences override the server's configuration field by field.
message Preferences {
  optional Delivery delivery = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional uint32 max_height = 2 [(buf.validate.field).uint32.gte = 2];
  SubtitleSelection subtitles = 3;
  AudioSelection audio = 4;
}

message AudioSelection {
  // languages are tried in order before the source's default track.
  repeated string languages = 1 [(buf.validate.field).repeated.items.string.pattern = "^[a-z]{2,3}$"];
}

message SubtitleSelection {
  oneof mode {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty disabled = 1;
    SubtitlePreferences preferences = 2;
  }
}

message SubtitlePreferences {
  repeated string languages = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {pattern: "^[a-z]{2,3}$"}
    }
  }];
  // transcribe_if_missing has Whisper caption a source with no caption in these languages.
  bool transcribe_if_missing = 2;
}

message WatchRequest {
  string cast_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];
}

message WatchResponse {
  oneof update {
    option (buf.validate.oneof).required = true;
    CastStatus status = 1;
    Ended ended = 2;
  }
}

message CastStatus {
  oneof state {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty connecting = 1;
    google.protobuf.Empty extracting = 2;
    MeasuringStatus measuring = 3;
    CastingStatus casting = 4;
  }
}

message MeasuringStatus {
  uint32 streams = 1;
  // castable is absent until ranking finishes.
  optional uint32 castable = 2;
}

message CastingStatus {
  uint32 streams = 1;
  uint32 castable = 2;
  uint32 attempt = 3 [(buf.validate.field).uint32.gte = 1];
  Revision revision = 4;
  // playhead is absent until the device reports a position, and on devices that never do.
  Playhead playhead = 5;
}

message Playhead {
  // position counts from the media's start, wherever the cast began.
  google.protobuf.Duration position = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  google.protobuf.Duration duration = 2 [(buf.validate.field).duration.gt = {}];
  // paused is set by Pause, by the device's own remote, or while castor buffers.
  bool paused = 3;
}

message Ended {
  oneof result {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty completed = 1;
    google.protobuf.Empty stopped = 2;
    Failure failed = 3;
  }
}

message Failure {
  FailureCode code = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string message = 2 [(buf.validate.field).string.min_len = 1];
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_PLAYBACK_FAILED = 1;
  FAILURE_CODE_DEVICE_UNREACHABLE = 2;
  FAILURE_CODE_EXTRACTION_FAILED = 3;
  FAILURE_CODE_SERVER_SHUTDOWN = 4;
  FAILURE_CODE_INTERNAL = 5;
}

message StopRequest {
  string cast_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];
}

message StopResponse {}

message ListCastsRequest {}

message ListCastsResponse {
  repeated Cast casts = 1;
}

message Cast {
  string id = 1;
  // device has an empty id for a pinned target.
  Device device = 2;
  Source source = 3;
  CastStatus status = 4;
}

message PauseRequest {
  string cast_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];
}

message PauseResponse {}

message ResumeRequest {
  string cast_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];
}

message ResumeResponse {}

message SeekRequest {
  string cast_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];
  // position counts from the media's start, as Playhead's does.
  google.protobuf.Duration position = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
}

message SeekResponse {}
