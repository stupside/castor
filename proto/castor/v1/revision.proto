syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";

// Revision is a cast's latest change of plan.
message Revision {
  RecoveryAction action = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string why = 2 [(buf.validate.field).string.min_len = 1];
}

enum RecoveryAction {
  RECOVERY_ACTION_UNSPECIFIED = 0;
  RECOVERY_ACTION_SWITCH_CANDIDATE = 1;
  RECOVERY_ACTION_DECODE_AXIS = 2;
  RECOVERY_ACTION_RELAX_READ = 3;
  RECOVERY_ACTION_SERVE_INSTEAD = 4;
  RECOVERY_ACTION_STAY = 5;
  // Convert a live source only after native planning refuses it.
  RECOVERY_ACTION_OPTIMIZE_LIVE = 6;
  // Encode the picture in software after a hardware encoder's output never validated.
  RECOVERY_ACTION_SOFTWARE_ENCODE = 7;
}
