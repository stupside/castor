syntax = "proto3";

package castor.media.v1;

import "buf/validate/validate.proto";
import "castor/media/v1/bitrate.proto";
import "castor/v1/cast.proto";
import "castor/v1/stream.proto";
import "google/protobuf/duration.proto";

// CastService starts, stops and follows casts.
service CastService {
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  // Watch follows a cast without driving it, as the public CastService.Watch does.
  rpc Watch(castor.v1.WatchRequest) returns (stream castor.v1.WatchResponse);
}

message StartRequest {
  string cast_id = 1 [(buf.validate.field).string.pattern = "^[A-Z2-7]{26}$"];
  Source source = 2 [(buf.validate.field).required = true];
  PlaybackSettings settings = 3 [(buf.validate.field).required = true];
  // start is where in the media to begin, the beginning when unset.
  google.protobuf.Duration start = 4 [(buf.validate.field).duration.gt = {}];
}

// PlaybackSettings is the API server's preferences resolved against its configuration.
message PlaybackSettings {
  castor.v1.Delivery delivery = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 max_height = 2 [(buf.validate.field).uint32.gte = 2];
  castor.v1.SubtitleSelection subtitles = 3 [(buf.validate.field).required = true];
  castor.v1.AudioSelection audio = 4;
  // max_bitrate is the most the cast asks of the device's link, absent for no ceiling.
  Bitrate max_bitrate = 5 [(buf.validate.field).cel = {
    id: "max_bitrate.range"
    message: "must be from 1 Mbit/s to 1 Tbit/s"
    expression: "this.bits_per_second >= 1000000 && this.bits_per_second <= 1000000000000"
  }];
}

message StartResponse {}

message StopRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
}

message StopResponse {}

// Source is a direct stream or extracted candidates, never pages.
message Source {
  oneof source {
    option (buf.validate.oneof).required = true;
    castor.v1.Stream stream = 1;
    Streams streams = 2;
  }
  message Streams {
    repeated castor.v1.StreamCandidate streams = 1 [(buf.validate.field).repeated = {
      min_items: 1
      max_items: 1600
    }];
  }
}
