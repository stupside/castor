syntax = "proto3";

package castor.media.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

// DeviceService lends a device to a cast: Drive streams the commands, Answer returns their results.
service DeviceService {
  // Drive lends a device for the whole cast, which starts once lent and plays on if its lender leaves.
  rpc Drive(DriveRequest) returns (stream DriveResponse);
  rpc Answer(AnswerRequest) returns (AnswerResponse);
}

message DriveRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
  Capabilities capabilities = 2 [(buf.validate.field).required = true];
}

message DriveResponse {
  DeviceCommand command = 1 [(buf.validate.field).required = true];
}

message AnswerRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
  string command_id = 2 [(buf.validate.field).string.min_len = 1];
  oneof answer {
    option (buf.validate.oneof).required = true;
    Done done = 3;
    DeviceError error = 4;
    Position position = 5;
  }

  message Done {}

  // Position answers a Position call; a device that cannot tell answers done.
  message Position {
    google.protobuf.Duration at = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gte = {}
    ];
    bool paused = 2;
  }
}

message AnswerResponse {}

message Capabilities {
  // formats are in preference order; the first is the default.
  repeated FormatSupport formats = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
  string provenance = 2;
  bool deinterlaces = 3;
  reserved 4;
  reserved "served_headers";
  // self_fetch is a device that can fetch the source itself.
  bool self_fetch = 5;
}

message FormatSupport {
  oneof transport {
    option (buf.validate.oneof).required = true;
    ProgressiveSupport progressive = 1;
    HLSSupport hls = 2;
  }
  oneof tracks {
    option (buf.validate.oneof).required = true;
    VideoSupport video = 3;
    AudioSupport audio = 4;
    AVSupport av = 5;
  }
  // captions are whole documents fetched apart from the media.
  repeated CaptionFormat captions = 6 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 7;
  reserved "served_headers";
}

message AVSupport {
  VideoSupport video = 1 [(buf.validate.field).required = true];
  AudioSupport audio = 2 [(buf.validate.field).required = true];
}

message ProgressiveSupport {
  enum Container {
    CONTAINER_UNSPECIFIED = 0;
    CONTAINER_MP4 = 1;
    CONTAINER_MPEGTS = 2;
    CONTAINER_MKV = 3;
    CONTAINER_WEBM = 4;
  }
  Container container = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // served_headers are set on every response that serves this format.
  map<string, string> served_headers = 2 [(buf.validate.field).map = {
    keys: {
      string: {well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME}
    }
    values: {
      string: {
        well_known_regex: KNOWN_REGEX_HTTP_HEADER_VALUE
        strict: false
      }
    }
  }];
}

message HLSSupport {
  enum Subtitles {
    SUBTITLES_UNSPECIFIED = 0;
    SUBTITLES_WEBVTT = 1;
  }
  Subtitles subtitles = 1 [(buf.validate.field).enum.defined_only = true];
  enum ExtraSegmentFormat {
    EXTRA_SEGMENT_FORMAT_UNSPECIFIED = 0;
    EXTRA_SEGMENT_FORMAT_TIKTIKPX = 1; // PNG/gzip/MPEG-TS envelope
  }
  repeated ExtraSegmentFormat extra_segment_formats = 2 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      enum: {
        not_in: [0]
      }
    }
  }];
}

message VideoSupport {
  oneof codec {
    option (buf.validate.oneof).required = true;
    H264Support h264 = 1;
    HEVCSupport hevc = 2;
    VP8Support vp8 = 3;
  }
}

message H264Support {
  enum Profile {
    PROFILE_UNSPECIFIED = 0;
    PROFILE_CONSTRAINED_BASELINE = 1;
    PROFILE_BASELINE = 2;
    PROFILE_MAIN = 3;
    PROFILE_HIGH = 4;
  }
  // Empty means any H.264 profile within the advertised level.
  repeated Profile profiles = 1 [(buf.validate.field).repeated = {
    max_items: 4
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  uint32 max_level = 2;
}

message HEVCSupport {
  enum Profile {
    PROFILE_UNSPECIFIED = 0;
    PROFILE_MAIN = 1;
    PROFILE_MAIN_10 = 2;
  }
  // Empty means any HEVC profile at the advertised bit depths.
  repeated Profile profiles = 1 [(buf.validate.field).repeated = {
    max_items: 2
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Empty means 8-bit only.
  repeated uint32 bit_depths = 2 [(buf.validate.field).repeated = {
    max_items: 3
    unique: true
    items: {
      uint32: {
        in: [
          8,
          10,
          12
        ]
      }
    }
  }];
  uint32 max_level = 3;
}

message VP8Support {}

message AudioSupport {
  AudioCodec codec = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 max_channels = 2;
}

enum CaptionFormat {
  CAPTION_FORMAT_UNSPECIFIED = 0;
  CAPTION_FORMAT_VTT = 1;
  CAPTION_FORMAT_SRT = 2;
}

enum Container {
  CONTAINER_UNSPECIFIED = 0;
  CONTAINER_MP4 = 1 [(mime) = "video/mp4"];
  CONTAINER_MPEGTS = 2 [(mime) = "video/mp2t"];
  CONTAINER_HLS = 3 [(mime) = "application/x-mpegURL"];
  CONTAINER_MKV = 4 [(mime) = "video/x-matroska"];
  CONTAINER_WEBM = 5 [(mime) = "video/webm"];
}

extend google.protobuf.EnumValueOptions {
  // mime is the content type a container is served as.
  string mime = 51000;
}

enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_AAC = 1;
  AUDIO_CODEC_AC3 = 2;
  AUDIO_CODEC_EAC3 = 3;
  AUDIO_CODEC_MP3 = 4;
  AUDIO_CODEC_VORBIS = 5;
}

message DeviceCommand {
  oneof command {
    option (buf.validate.oneof).required = true;
    Call call = 1;
    // cancel is never answered.
    Cancel cancel = 2;
  }

  message Call {
    string id = 1 [(buf.validate.field).string.min_len = 1];
    oneof operation {
      option (buf.validate.oneof).required = true;
      Play play = 2;
      AwaitEnd await_end = 3;
      Pause pause = 4;
      Resume resume = 5;
      Position position = 6;
    }
  }

  message Play {
    string url = 1 [(buf.validate.field).string = {
      uri: true
      pattern: "^https?://"
      max_bytes: 8192
    }];
    repeated Caption captions = 3;
    oneof stream {
      option (buf.validate.oneof).required = true;
      Source source = 6;
      Progressive progressive = 7;
      Playlist playlist = 8;
    }
    reserved 2, 4, 5;
    reserved "container", "duration", "seek";

    // Source is fetched from its own server, which alone knows how it seeks.
    message Source {
      Container container = 1 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }];
      google.protobuf.Duration duration = 2 [(buf.validate.field).duration.gt = {}];
    }

    message Progressive {
      Container container = 1 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [
          0,
          3
        ]
      }];
      // runtime is absent for a stream served from its start only.
      Runtime runtime = 2;
    }

    message Runtime {
      enum Seek {
        SEEK_UNSPECIFIED = 0;
        SEEK_START = 1;
        SEEK_TIME = 2;
      }
      google.protobuf.Duration duration = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).duration.gt = {}
      ];
      Seek seek = 2 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }];
    }

    // Playlist is an HLS playlist the media server makes.
    message Playlist {
      google.protobuf.Duration duration = 1 [(buf.validate.field).duration.gt = {}];
      // segments is the container the playlist is cut into.
      Container segments = 2 [(buf.validate.field).enum = {
        in: [
          1,
          2
        ]
      }];
    }
  }

  message Caption {
    string url = 1 [(buf.validate.field).string = {
      uri: true
      pattern: "^https?://"
      max_bytes: 8192
    }];
    CaptionFormat format = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    // language is the tag as the source gave it, empty when untagged.
    string language = 3;
    string name = 4;
    bool default = 5;
  }

  message AwaitEnd {}

  message Pause {}

  message Resume {}

  message Position {}

  message Cancel {
    string command_id = 1 [(buf.validate.field).string.min_len = 1];
  }
}

message DeviceError {
  oneof error {
    option (buf.validate.oneof).required = true;
    string message = 1 [(buf.validate.field).string.min_len = 1];
    Gone gone = 2;
  }

  message Gone {
    string device = 1;
    string observed = 2;
    string cause = 3;
  }
}
