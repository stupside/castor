syntax = "proto3";

package castor.scraping.v1;

import "buf/validate/validate.proto";
import "castor/v1/stream.proto";

// ScrapingService resolves web pages into stream candidates.
service ScrapingService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}

message ResolveRequest {
  repeated string urls = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
    items: {
      string: {
        uri: true
        pattern: "^https?://"
        max_bytes: 8192
      }
    }
  }];
}

message ResolveResponse {
  repeated castor.v1.StreamCandidate streams = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1600
  }];
}
